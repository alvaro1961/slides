<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Convolution Explorer</title>
<style>
  :root {
    --ink: #1c1c2a;
    --slate: #52596b;
    --muted: #8892a0;
    --bg: #f9f8f5;
    --card: #ffffff;
    --border: #e2e3da;
    --blue: #1d4ed8;
    --blue-light: #eff4ff;
    --amber: #b45309;
    --amber-light: #fffbeb;
    --teal: #0f766e;
    --teal-light: #f0fdf9;
    --highlight-in: #dbeafe;
    --highlight-out: #d1fae5;
    --highlight-border-in: #3b82f6;
    --highlight-border-out: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 28px 20px 48px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--ink);
  }

  .subtitle {
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .ctrl-group label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select, input[type="range"] {
    font-size: 0.88rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    height: 32px;
  }

  input[type="range"] {
    padding: 0;
    width: 120px;
    cursor: pointer;
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .speed-val {
    font-size: 0.82rem;
    color: var(--slate);
    min-width: 30px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  button {
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  button:hover { background: var(--bg); }
  button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.primary:hover { background: #1e40af; }

  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 20px;
    align-items: start;
    margin-bottom: 20px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .panel-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .grid-wrap {
    display: flex;
    justify-content: center;
  }

  table.grid {
    border-collapse: collapse;
  }

  table.grid td {
    width: 44px;
    height: 44px;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 500;
    border: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s;
    color: var(--slate);
  }

  td.active-in {
    background: var(--highlight-in) !important;
    border-color: var(--highlight-border-in) !important;
    color: #1d4ed8 !important;
    font-weight: 700;
  }

  td.active-out {
    background: var(--highlight-out) !important;
    border-color: var(--highlight-border-out) !important;
    color: #065f46 !important;
    font-weight: 700;
  }

  td.filled-out {
    background: #f0fdf4;
    color: var(--teal);
  }

  td.filled-empty {
    background: #fafaf7;
    color: var(--muted);
  }

  td.padded {
    background: #f8f8f6;
    color: #c8cdd6;
    font-style: italic;
  }

  .kernel-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    min-width: 160px;
  }

  table.grid.kernel td {
    width: 46px;
    height: 46px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--amber-light);
    color: var(--amber);
    border-color: #fde68a;
  }

  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--muted);
    padding-top: 60px;
  }

  .math-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    min-height: 90px;
  }

  .math-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .math-expr {
    font-size: 0.92rem;
    color: var(--slate);
    line-height: 1.8;
    font-family: 'Courier New', monospace;
  }

  .math-expr .v-in  { color: #1d4ed8; font-weight: 700; }
  .math-expr .v-k   { color: var(--amber); font-weight: 700; }
  .math-expr .v-sum { color: var(--teal); font-weight: 700; font-size: 1rem; }

  .status-bar {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .status-bar span { color: var(--slate); font-weight: 600; }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--slate);
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<h1>Convolution Explorer</h1>
<p class="subtitle">Watch a kernel slide across an image and build the output one value at a time</p>

<div class="controls">
  <div class="ctrl-group">
    <label>Kernel</label>
    <select id="kernelSelect">
      <option value="identity">Identity</option>
      <option value="average">Average (blur)</option>
      <option value="sharpen">Sharpen</option>
      <option value="sobelH" selected>Sobel horizontal (edges)</option>
      <option value="sobelV">Sobel vertical (edges)</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Stride</label>
    <select id="strideSelect">
      <option value="1" selected>1</option>
      <option value="2">2</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Padding</label>
    <select id="paddingSelect">
      <option value="0" selected>None</option>
      <option value="1">Zero-pad (1)</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Speed</label>
    <div class="speed-row">
      <input type="range" id="speedSlider" min="1" max="10" step="1" value="4"/>
      <span class="speed-val" id="speedVal">4</span>
    </div>
  </div>

  <div class="ctrl-group">
    <label>&nbsp;</label>
    <div class="btn-group">
      <button class="primary" id="playBtn">&#9654; Play</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<div class="arena">
  <div class="panel">
    <div class="panel-title">Input</div>
    <div class="grid-wrap"><table class="grid" id="inputGrid"></table></div>
  </div>

  <div>
    <div class="kernel-panel">
      <div class="panel-title">Kernel</div>
      <div class="grid-wrap"><table class="grid kernel" id="kernelGrid"></table></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Output</div>
    <div class="grid-wrap"><table class="grid" id="outputGrid"></table></div>
  </div>
</div>

<div class="math-panel">
  <div class="math-title">Computation at current position</div>
  <div class="math-expr" id="mathExpr">Press Play or Step to begin</div>
</div>

<div class="status-bar" id="statusBar">
  Position: — &nbsp;|&nbsp; Output size: —
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#dbeafe; border: 1px solid #3b82f6;"></div>
    Active receptive field
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#d1fae5; border: 1px solid #10b981;"></div>
    Current output cell
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f0fdf4; border: 1px solid #d1fae5;"></div>
    Filled output
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background: var(--amber-light); border: 1px solid #fde68a;"></div>
    Kernel values
  </div>
</div>

<script>
const KERNELS = {
  identity: { label: 'Identity', data: [[0,0,0],[0,1,0],[0,0,0]] },
  average:  { label: 'Average',  data: [[1/9,1/9,1/9],[1/9,1/9,1/9],[1/9,1/9,1/9]] },
  sharpen:  { label: 'Sharpen',  data: [[0,-1,0],[-1,5,-1],[0,-1,0]] },
  sobelH:   { label: 'Sobel H',  data: [[-1,-2,-1],[0,0,0],[1,2,1]] },
  sobelV:   { label: 'Sobel V',  data: [[-1,0,1],[-2,0,2],[-1,0,1]] },
};

const INPUT_RAW = [
  [10,  10,  10,  10, 200, 200],
  [10,  10,  10,  10, 200, 200],
  [10,  10,  10,  10, 200, 200],
  [200,200, 200, 200,  10,  10],
  [200,200, 200, 200,  10,  10],
  [200,200, 200, 200,  10,  10],
];

let kernel, stride, padding, input, positions, step, animTimer, playing;

function fmt(v) { return Number(v.toFixed(2)); }

function buildInput() {
  const p = parseInt(document.getElementById('paddingSelect').value);
  if (p === 0) return INPUT_RAW.map(r => [...r]);
  const rows = INPUT_RAW.length + 2 * p;
  const cols = INPUT_RAW[0].length + 2 * p;
  const padded = Array.from({length: rows}, (_, r) =>
    Array.from({length: cols}, (_, c) => {
      const rr = r - p, cc = c - p;
      if (rr < 0 || rr >= INPUT_RAW.length || cc < 0 || cc >= INPUT_RAW[0].length) return 0;
      return INPUT_RAW[rr][cc];
    })
  );
  return padded;
}

function buildPositions() {
  const rows = input.length, cols = input[0].length;
  const k = 3;
  const pos = [];
  for (let r = 0; r <= rows - k; r += stride)
    for (let c = 0; c <= cols - k; c += stride)
      pos.push([r, c]);
  return pos;
}

function outDims() {
  const rows = input.length, cols = input[0].length;
  return [Math.floor((rows - 3) / stride) + 1, Math.floor((cols - 3) / stride) + 1];
}

function computeConv(r, c) {
  let sum = 0;
  const terms = [];
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++) {
      const iv = input[r+i][c+j];
      const kv = kernel.data[i][j];
      sum += iv * kv;
      terms.push({iv, kv, prod: iv * kv});
    }
  return {sum, terms};
}

function renderInputGrid(activeR, activeC) {
  const p = parseInt(document.getElementById('paddingSelect').value);
  const table = document.getElementById('inputGrid');
  table.innerHTML = '';
  for (let r = 0; r < input.length; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < input[0].length; c++) {
      const td = document.createElement('td');
      td.textContent = input[r][c];
      const isPad = p > 0 && (r < p || r >= input.length - p || c < p || c >= input[0].length - p);
      if (isPad) td.classList.add('padded');
      if (activeR !== null && r >= activeR && r < activeR+3 && c >= activeC && c < activeC+3)
        td.classList.add('active-in');
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

function renderKernelGrid() {
  const table = document.getElementById('kernelGrid');
  table.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const tr = document.createElement('tr');
    for (let j = 0; j < 3; j++) {
      const td = document.createElement('td');
      td.textContent = fmt(kernel.data[i][j]);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

function renderOutputGrid(filled, activeOutR, activeOutC) {
  const [outR, outC] = outDims();
  const table = document.getElementById('outputGrid');
  table.innerHTML = '';
  for (let r = 0; r < outR; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < outC; c++) {
      const td = document.createElement('td');
      const key = `${r},${c}`;
      if (filled[key] !== undefined) {
        td.textContent = fmt(filled[key]);
        if (r === activeOutR && c === activeOutC)
          td.classList.add('active-out');
        else
          td.classList.add('filled-out');
      } else {
        td.textContent = '·';
        td.classList.add('filled-empty');
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

function renderMath(terms, sum) {
  const parts = terms.map(t =>
    `<span class="v-in">${fmt(t.iv)}</span>×<span class="v-k">${fmt(t.kv)}</span>`
  ).join(' + ');
  document.getElementById('mathExpr').innerHTML =
    parts + ' = <span class="v-sum">' + fmt(sum) + '</span>';
}

let filledCells = {};

function init() {
  const kKey = document.getElementById('kernelSelect').value;
  kernel = KERNELS[kKey];
  stride = parseInt(document.getElementById('strideSelect').value);
  padding = parseInt(document.getElementById('paddingSelect').value);
  input = buildInput();
  positions = buildPositions();
  step = 0;
  filledCells = {};
  playing = false;
  clearInterval(animTimer);
  document.getElementById('playBtn').textContent = '▶ Play';

  renderInputGrid(null, null);
  renderKernelGrid();
  const [outR, outC] = outDims();
  renderOutputGrid({}, null, null);
  document.getElementById('mathExpr').innerHTML = 'Press Play or Step to begin';
  document.getElementById('statusBar').innerHTML =
    `Position: — &nbsp;|&nbsp; Output size: <span>${outR} × ${outC}</span>`;
}

function doStep() {
  if (step >= positions.length) {
    clearInterval(animTimer);
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
    document.getElementById('mathExpr').innerHTML = '<span class="v-sum">Done!</span> All output values computed.';
    return;
  }

  const [r, c] = positions[step];
  const outRow = Math.floor(step / outDims()[1]);
  const outCol = step % outDims()[1];
  const {sum, terms} = computeConv(r, c);

  filledCells[`${outRow},${outCol}`] = sum;

  renderInputGrid(r, c);
  renderOutputGrid(filledCells, outRow, outCol);
  renderMath(terms, sum);

  const [outR, outC] = outDims();
  document.getElementById('statusBar').innerHTML =
    `Position: <span>(${r}, ${c})</span> &nbsp;|&nbsp; Output cell: <span>(${outRow}, ${outCol})</span> &nbsp;|&nbsp; Output size: <span>${outR} × ${outC}</span>`;

  step++;
}

function togglePlay() {
  if (step >= positions.length) { init(); return; }
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) {
    const speed = parseInt(document.getElementById('speedSlider').value);
    const delay = Math.round(1200 / speed);
    doStep();
    animTimer = setInterval(() => {
      if (step >= positions.length) {
        clearInterval(animTimer);
        playing = false;
        document.getElementById('playBtn').textContent = '▶ Play';
      } else {
        doStep();
      }
    }, delay);
  } else {
    clearInterval(animTimer);
  }
}

document.getElementById('playBtn').addEventListener('click', togglePlay);
document.getElementById('stepBtn').addEventListener('click', () => {
  if (playing) { clearInterval(animTimer); playing = false; document.getElementById('playBtn').textContent = '▶ Play'; }
  doStep();
});
document.getElementById('resetBtn').addEventListener('click', init);

document.getElementById('kernelSelect').addEventListener('change', init);
document.getElementById('strideSelect').addEventListener('change', init);
document.getElementById('paddingSelect').addEventListener('change', init);

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value;
  if (playing) {
    clearInterval(animTimer);
    const delay = Math.round(1200 / parseInt(this.value));
    animTimer = setInterval(() => {
      if (step >= positions.length) { clearInterval(animTimer); playing = false; document.getElementById('playBtn').textContent = '▶ Play'; }
      else doStep();
    }, delay);
  }
});

init();
</script>
</body>
</html>
